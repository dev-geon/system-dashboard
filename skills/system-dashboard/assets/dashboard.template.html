<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 토큰 — 색은 여기서만 정한다. 다이어그램도 이 값을 읽는다 (references/layout.md) */
:root{
  --brand:#1F6FEB; --brand-fill:#1F6FEB; --on-brand:#FFFFFF;
  --bg:#F5F7FA; --surface:#FFFFFF; --ink:#14202E; --muted:#5B6B7F;
  --line:#DCE3EC; --node:#EEF4FE; --warn:#9A6700;
  --font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --brand:#4C8DF6; --brand-fill:#1F6FEB; --on-brand:#FFFFFF;
    --bg:#0E1520; --surface:#152031; --ink:#E4EAF2; --muted:#94A3B6;
    --line:#26354A; --node:#1A2B44; --warn:#D9A441;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--brand)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
@media (min-width:720px){.wrap{padding:0 32px}}

/* 성능 표 — AS IS ▶ TO BE 바로 아래. TO BE 열은 파란 강조, 변화는 칩 */
.perf{margin:16px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.perf h2{margin:0 0 10px;font-size:15px;font-weight:800}
.perf .tbl{overflow-x:auto}
.perf table{border-collapse:collapse;width:100%;min-width:480px;font-variant-numeric:tabular-nums}
.perf th,.perf td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.perf thead th{font-size:12px;color:var(--muted);font-weight:700}
.perf th[scope=row],.perf thead th:first-child{text-align:left;font-weight:600;color:var(--ink);white-space:normal}
.perf thead th:first-child{color:var(--muted)}
.perf tbody tr:last-child>*{border-bottom:0}
.perf .asis{color:var(--muted)}
.perf td.tobe{color:var(--brand);font-weight:800;font-size:16px}
.perf thead th.tobe{color:var(--brand)}
.perf th[scope=row]{min-width:180px}
.perf th.note,.perf td.note{text-align:left;white-space:normal;min-width:260px}
.perf td.note{color:var(--muted);font-size:13px;line-height:1.55}
.perf td.note strong{color:var(--ink)}
.perf .chip{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink)}
.perf-src{margin:10px 0 0;font-size:12px;color:var(--muted)}
/* 이관 안내 — 프로젝트 단위로 옮기는 작업의 좌우 대응 지도. 왼쪽 AS IS 흰 카드 ─[이동 방식]▶ 오른쪽 TO BE 파란 카드.
   옮기지 않는 항목(유지·폐기)은 점선 화살표와 점선 빈 카드 */
.move{margin:16px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.move h2{margin:0 0 12px;font-size:15px;font-weight:800}
.mv-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mv-row{display:grid;grid-template-columns:minmax(0,1fr) 112px minmax(0,1fr);align-items:stretch}
.mv-head{margin:0 0 10px}
.mv-side{margin:0;display:flex;flex-direction:column;gap:2px;font-size:14px;font-weight:800;line-height:1.45}
.mv-side .tag{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.mv-side.as{color:var(--ink)}.mv-side.to{color:var(--brand)}
.mv-card{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:12px 14px;border-radius:12px;min-height:64px}
.mv-card.as{background:var(--bg);border:1.5px solid var(--line);color:var(--ink)}
.mv-card.to{background:var(--brand-fill);border:1.5px solid var(--brand-fill);color:var(--on-brand)}
.mv-card.to.keep{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.mv-item{font-size:14px;font-weight:800}
.mv-loc{font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.mv-card.as .mv-loc{color:var(--muted)}
.mv-card.to .mv-loc{font-weight:700}
.mv-note{font-size:12.5px;line-height:1.5;opacity:.9}
.mv-card code{font-family:var(--mono);font-size:12.5px;background:none;padding:0;color:inherit}
.mv-link{position:relative;display:flex;align-items:center;justify-content:center}
.mv-link::before{content:"";position:absolute;left:6px;right:12px;top:50%;border-top:1.6px solid var(--brand)}
.mv-link::after{content:"";position:absolute;right:4px;top:50%;transform:translateY(-50%);border-style:solid;border-width:5px 0 5px 9px;border-color:transparent transparent transparent var(--brand)}
.mv-link.keep::before{border-top:1.6px dashed var(--muted)}
.mv-link.keep::after{border-left-color:var(--muted)}
.mv-kind{position:relative;z-index:1;padding:2px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--brand);color:var(--brand);font-size:12px;font-weight:800;white-space:nowrap}
.mv-link.keep .mv-kind{border-color:var(--line);color:var(--muted)}
@media (max-width:719px){.mv-row{grid-template-columns:1fr}.mv-head span{display:none}.mv-link{min-height:34px}.mv-link::before{left:50%;right:auto;top:4px;bottom:10px;border-top:0;border-left:1.6px solid var(--brand)}.mv-link::after{left:50%;right:auto;top:auto;bottom:2px;transform:translateX(-50%);border-width:9px 5px 0 5px;border-color:var(--brand) transparent transparent transparent}.mv-link.keep::before{border-top:0;border-left:1.6px dashed var(--muted)}.mv-link.keep::after{border-top-color:var(--muted);border-left-color:transparent}}

/* 화면에 보이는 머리는 두지 않는다 — AS IS 가 맨 위. 제목은 보조기술용으로만 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.meta li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.meta b{color:var(--ink);font-weight:600}

/* 관점 탭 */
.views{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:24px 0}
@media (min-width:720px){.views{padding:20px 24px}}
.tabs[hidden]{display:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:thin}
.tabs button{flex:none;font:inherit;font-size:14px;font-weight:700;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:12px;padding:8px 16px;cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--brand-fill);border-color:var(--brand-fill);color:var(--on-brand)}
.tabs button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.panel h2{margin:4px 0 6px;font-size:16px;font-weight:600;line-height:1.5;color:var(--ink)}
.panel .kind{margin:0 0 8px;color:var(--muted);font-size:13px}
.panel .intro{margin:0 0 8px;max-width:72ch}
.panel:focus-visible{outline:2px solid var(--brand);outline-offset:4px;border-radius:8px}
.dia{margin:0;padding:12px 0;overflow-x:auto}
pre.mermaid{margin:0;padding:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;font:13px/1.5 var(--mono);color:var(--ink);white-space:pre;text-align:left}
pre.mermaid[data-processed]{background:none;border:0;padding:0;text-align:center;white-space:normal}
pre.mermaid svg{max-width:100%;height:auto}
.dia-note{margin:8px 0 0;color:var(--warn);font-size:13px}

/* 구조도 — 계층을 왼쪽→오른쪽 칸으로 (흐름도의 위→아래와 구별). 선은 수평·수직 직선만.
   참조 슬라이드처럼 흰 카드 · 파란 블록 · 굵은 이름. 새 부분은 TO BE 처럼 파란 카드 */
.arch{overflow-x:auto;padding:8px 0 4px}
.arch-canvas{position:relative;display:flex;align-items:stretch;justify-content:center;gap:88px;width:max-content;min-width:100%;margin:0 auto}
.tier{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;width:200px;padding:16px 14px 20px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.tier-name{min-height:2.8em;display:flex;align-items:center;font-size:13px;font-weight:800;color:var(--brand);line-height:1.4;text-align:center}
.tier-cards{flex:1;display:flex;flex-direction:column;justify-content:center;gap:44px}
.arch-canvas.compact .tier{width:176px;padding:14px 8px 18px}
.arch-canvas.compact .card{width:160px;padding:11px 12px}
.card{position:relative;z-index:1;display:flex;flex-direction:column;gap:3px;width:172px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none}
.card .ico{width:20px;height:20px;color:var(--brand);margin-bottom:4px}
.card .nm{font-size:15px;font-weight:800;line-height:1.3;letter-spacing:-.01em}
.card .ty{font-size:12px;color:var(--muted);line-height:1.45}
.card .kd{position:absolute;top:11px;right:12px;font-size:10.5px;color:var(--muted)}
.card.shape-predefined{border-style:dashed}
.card.added{background:var(--brand-fill);border-color:var(--brand-fill);color:var(--on-brand)}
.card.added .ico,.card.added .ty,.card.added .kd{color:var(--on-brand)}
.card.added .ty,.card.added .kd{opacity:.85}
svg.arch-wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.arch-labels{position:absolute;inset:0;pointer-events:none;z-index:2}
.wl{position:absolute;transform:translate(-50%,-50%);max-width:168px;padding:2px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;line-height:1.35;color:var(--ink);text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.wl.added{border-color:var(--brand);color:var(--brand)}
.lg-card{display:inline-flex;align-items:center;justify-content:center;width:24px;height:18px;border:1.5px solid var(--line);border-radius:5px;background:var(--surface);color:var(--brand)}
.lg-card .ico{width:12px;height:12px;margin:0}
.lg-card.shape-predefined{border-style:dashed}
.lg-card.added{background:var(--brand-fill);border-color:var(--brand-fill)}

/* 범례 */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 4px;padding:10px 0 0;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.legend .it{display:inline-flex;align-items:center;gap:6px}
.sh{display:inline-block;width:22px;height:14px;border:1.5px solid var(--brand);background:var(--node)}
.sh.terminal{border-radius:999px}
.sh.decision{width:13px;height:13px;transform:rotate(45deg);margin:0 4px}
.sh.io{transform:skewX(-18deg)}
.sh.predefined{box-shadow:inset 3px 0 0 -1.5px var(--brand),inset -3px 0 0 -1.5px var(--brand)}
.sh.db{border-radius:50%/30%}
.sh.prep{clip-path:polygon(22% 0,78% 0,100% 50%,78% 100%,22% 100%,0 50%);border:0;background:var(--brand)}
.sh.connector{width:14px;border-radius:50%}
.sh.doc{border-radius:0 0 40% 0/0 0 30% 0}
.ar{width:34px;height:10px;flex:none}

/* 예시 — 흐름도 경로별 실제 사례 카드. 배지는 그림의 끝 단말 `A · …` 와 맞춘다 */
.cases{margin-top:16px}
.cases h3{margin:0 0 10px;font-size:15px;font-weight:700}
.case-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.case{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.case p{margin:0}
.case .path{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.case .badge{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--brand-fill);color:var(--on-brand);font-size:13px;font-weight:800}
.case .q{margin-top:10px;font-weight:600;color:var(--ink)}
.case .r{margin-top:6px;font-size:14px;color:var(--muted);line-height:1.6}

/* 흐름도 + 예시 — 그림 왼쪽, 경로별 예시 오른쪽(세로 한 줄). 좁으면 위아래로 */
.flow-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:28px;align-items:start}
.flow-split .cases{margin-top:12px;position:sticky;top:16px}
.flow-split .case-list{grid-template-columns:1fr}
@media (max-width:899px){.flow-split{grid-template-columns:1fr;gap:0}}

/* 작업 Jira — 화면 맨 아래. 티켓 번호(실제 링크) · 타이틀 · 유형 */
.answers{margin:16px 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.answers h2{margin:0 0 6px;font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:12px}
.ans-toggle{font:inherit;font-size:12px;font-weight:700;color:var(--brand);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
.ans-toggle:hover{border-color:var(--brand)}
.ans{border-top:1px solid var(--line)}
.ans summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline;padding:12px 2px;font-weight:600}
.ans summary::-webkit-details-marker{display:none}
.ans summary::before{content:"▸";color:var(--muted);font-size:12px}
.ans[open] summary::before{content:"▾"}
.ans summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.ans-n{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--brand);min-width:2.2em}
.ans-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;padding:0 0 16px}
.ans-pair.one{grid-template-columns:minmax(0,1fr)}
.ans-side{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);min-width:0}
.ans-side.to{border-color:var(--brand)}
.ans-side header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.ans-side .tag{font-size:11px;font-weight:800;letter-spacing:.02em;padding:2px 8px;border-radius:6px;background:var(--surface);color:var(--brand);border:1px solid var(--line)}
.ans-side.to .tag{background:var(--brand-fill);color:var(--on-brand);border-color:var(--brand-fill)}
.ans-meta{font-size:12px;color:var(--muted)}
.md{font-size:14px;line-height:1.6;word-break:normal}
.md h4,.md h5,.md h6{margin:12px 0 6px;font-size:14px;font-weight:800}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:20px}
.md .md-tbl{overflow-x:auto;margin:8px 0}
.md table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top;overflow-wrap:normal;word-break:keep-all}
.md th{background:var(--surface);font-weight:700}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--surface);padding:1px 4px;border-radius:4px}
.md pre{background:var(--surface);padding:8px 10px;border-radius:8px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md blockquote{margin:6px 0;padding:2px 10px;border-left:3px solid var(--line);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:10px 0}
@media (max-width:900px){.ans-pair{grid-template-columns:minmax(0,1fr)}}
@media print{.ans-toggle{display:none}}
.jira{margin:0 0 40px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.jira h2{margin:0 0 10px;font-size:15px;font-weight:800}
.jira ul{margin:0;padding:0;list-style:none}
.jira li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:10px 2px;border-bottom:1px solid var(--line)}
.jira li:last-child{border-bottom:0}
.jira .key{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--brand);text-decoration:none;padding:3px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.jira .key:hover{border-color:var(--brand)}
.jira .tt{font-weight:600;color:var(--ink)}
.jira .kd{font-size:12px;color:var(--muted);padding:2px 9px;border-radius:999px;border:1px solid var(--line)}
.jira .kd.initiative{color:var(--on-brand);background:var(--brand-fill);border-color:var(--brand-fill)}

/* 히어로 — AS IS ▶ TO BE. 참조 슬라이드의 반반 분할 · 가운데 흰 삼각형 홈 · 하단 가는 선 */
.ab-wrap{margin:16px 0 0}
.ab{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:20px;overflow:hidden;min-height:300px}
.ab section{display:flex;flex-direction:column;justify-content:center;padding:44px 28px 48px}
@media (min-width:720px){.ab section{padding:64px 56px}}
.ab .as{background:var(--surface);color:var(--brand)}
.ab .to{background:var(--brand-fill);color:var(--on-brand);position:relative}
@media (min-width:720px){.ab .to{padding-left:80px}}
.ab .to::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);border-style:solid;border-width:26px 0 26px 26px;border-color:transparent transparent transparent var(--surface)}
.ab h2{margin:0 0 20px;font-size:clamp(32px,5vw,52px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.ab .body{max-width:44ch;font-size:clamp(15px,1.5vw,17px);line-height:1.75;font-weight:500}
.ab .body p{margin:0}
.ab .body p+p{margin-top:8px}
.ab .body ul{margin:0;padding-left:1.1em}
@media (max-width:719px){
  .ab{grid-template-columns:1fr;min-height:0}
  .ab .to{padding-top:56px}
  .ab .to::before{left:28px;top:0;transform:none;border-width:22px 22px 0 22px;border-color:var(--surface) transparent transparent transparent}
}

@media print{
  .tabs{display:none}
  .panel[hidden]{display:block!important}
  .panel{break-inside:avoid;margin-bottom:24px}
}
</style>
</head>
<body>
<h1 class="sr-only">{{TITLE}}</h1>

<main class="wrap">
{{ASISTOBE}}
{{COMPARE}}
{{MOVE}}

  <section class="views" aria-label="관점">
    <div class="tabs" role="tablist" aria-label="관점 선택">{{TABS}}</div>
{{PANELS}}
  </section>
{{ANSWERS}}
{{JIRA}}
</main>
<script>
// 질문별 답 — 모두 펼치기/접기, 인쇄할 때는 모두 펼친다
(function () {
  var btn = document.querySelector(".ans-toggle");
  if (!btn) return;
  var all = function () { return document.querySelectorAll("details.ans"); };
  btn.addEventListener("click", function () {
    var open = btn.getAttribute("aria-pressed") !== "true";
    all().forEach(function (d) { d.open = open; });
    btn.setAttribute("aria-pressed", String(open));
    btn.textContent = open ? "모두 접기" : "모두 펼치기";
  });
  window.addEventListener("beforeprint", function () { all().forEach(function (d) { d.open = true; }); });
})();
</script>


<script type="module">
// mermaid.js 는 버전을 고정해 CDN 에서 불러온다. 못 불러오면 소스를 그대로 보여 준다.
const MERMAID_URL = "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
const KEY = "system-dashboard:" + location.pathname;

const tabs = [...document.querySelectorAll('[role="tab"]')];
const panels = [...document.querySelectorAll('[role="tabpanel"]')];
const blocks = [...document.querySelectorAll("pre.mermaid")];
const sources = blocks.map((el) => el.textContent);
// 관점이 하나면 고를 것이 없으니 탭 줄을 숨긴다
if (tabs.length < 2) document.querySelector(".tabs").hidden = true;

let current = 0;
try { current = Math.min(Number(localStorage.getItem(KEY)) || 0, tabs.length - 1); } catch (e) {}

function select(i, focus) {
  current = i;
  tabs.forEach((t, k) => { t.setAttribute("aria-selected", String(k === i)); t.tabIndex = k === i ? 0 : -1; });
  panels.forEach((p, k) => { p.hidden = k !== i; });
  if (focus) tabs[i].focus();
  try { localStorage.setItem(KEY, String(i)); } catch (e) {}
}
tabs.forEach((t, i) => {
  t.addEventListener("click", () => select(i));
  t.addEventListener("keydown", (e) => {
    const n = tabs.length;
    const to = { ArrowRight: (i + 1) % n, ArrowLeft: (i - 1 + n) % n, Home: 0, End: n - 1 }[e.key];
    if (to !== undefined) { e.preventDefault(); select(to, true); }
  });
});

const tok = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

async function render(mermaid) {
  // 숨은 패널에서 그리면 크기가 0 으로 잡힌다 — 전부 보이게 한 뒤 그리고 탭을 되돌린다
  panels.forEach((p) => { p.hidden = false; });
  blocks.forEach((el, i) => { el.removeAttribute("data-processed"); el.textContent = sources[i]; });
  const font = tok("--font");
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: "loose",          // click 링크를 쓰려면 필요하다. 소스는 우리 레포의 dashboard.md 뿐이다
    theme: "base",
    fontFamily: font,
    flowchart: { htmlLabels: true, curve: "basis", padding: 12 },
    sequence: { mirrorActors: false },
    themeVariables: {
      fontFamily: font, fontSize: "14px",
      primaryColor: tok("--node"), primaryBorderColor: tok("--brand"), primaryTextColor: tok("--ink"),
      secondaryColor: tok("--surface"), tertiaryColor: tok("--surface"),
      mainBkg: tok("--node"), nodeBorder: tok("--brand"), textColor: tok("--ink"),
      lineColor: tok("--muted"), edgeLabelBackground: tok("--surface"),
      clusterBkg: tok("--bg"), clusterBorder: tok("--line"), titleColor: tok("--ink"),
      actorBkg: tok("--node"), actorBorder: tok("--brand"), actorTextColor: tok("--ink"), actorLineColor: tok("--line"),
      signalColor: tok("--muted"), signalTextColor: tok("--ink"),
      noteBkgColor: tok("--surface"), noteBorderColor: tok("--line"), noteTextColor: tok("--ink"),
      labelBoxBkgColor: tok("--surface"), labelBoxBorderColor: tok("--line"), labelTextColor: tok("--ink"),
      loopTextColor: tok("--ink"), activationBkgColor: tok("--node"), activationBorderColor: tok("--brand"),
    },
  });
  await mermaid.run({ nodes: blocks, suppressErrors: true });
  // 좁은 화면에서 글자가 읽히지 않을 만큼 줄어들지 않게 한다 — 원래 폭의 75% 밑으로는 가로 스크롤
  blocks.forEach((el) => {
    const svg = el.querySelector("svg");
    const w = svg && svg.viewBox && svg.viewBox.baseVal ? svg.viewBox.baseVal.width : 0;
    if (w) svg.style.minWidth = Math.round(w * 0.75) + "px";
  });
  select(current);
}

// 구조도 화살표 — 수평·수직 직선만. 다른 칸이면 카드 옆 → 칸 사이 통로의 줄기에서 꺾어 → 대상 카드 옆(직각),
// 같은 칸이면 위아래 카드를 수직선으로 잇는다. 카드 위치를 재서 그린다.
// 통로 폭은 고정이 아니다 — 그 통로를 지나는 줄기 수와 라벨 폭만큼 넓힌다. 통로 안은 [줄기][라벨 구역] 순서라
// 라벨이 다른 줄기를 덮지 않는다. 같은 카드 가장자리로 들어오는 선이 여럿이면 라벨 높이만큼 벌어지게 카드를 늘린다.
// 줄기 순서는 엇갈림이 가장 적은 순서로 고르고, 그래도 엇갈리는 자리는 선 밑에 바탕색 테를 깔아 끊어 보이게 한다.
function drawArch(root) {
  const canvas = root.querySelector(".arch-canvas");
  const svg = canvas.querySelector("svg.arch-wires");
  const lab = canvas.querySelector(".arch-labels");
  if (!canvas.getBoundingClientRect().width) return;   // 숨은 탭 — 보일 때 다시 그린다(ResizeObserver)
  const NS = "http://www.w3.org/2000/svg";
  const css = getComputedStyle(document.documentElement);
  const muted = css.getPropertyValue("--muted").trim(), brand = css.getPropertyValue("--brand").trim();
  const ground = css.getPropertyValue("--surface").trim();
  const LANE = 16, END = 12, LGAP = 8, MIN_GAP = 72, LABEL_SEP = 10;
  const tiers = [...canvas.querySelectorAll(".tier")];
  const card = (id) => canvas.querySelector('[data-id="' + CSS.escape(id) + '"]');
  const push = (m, k, v) => { (m.get(k) || m.set(k, []).get(k)).push(v); };
  const edges = JSON.parse(root.dataset.edges || "[]").map((e) => {
    const ae = card(e.s), be = card(e.t);
    if (!ae || !be) return null;
    const at = +ae.dataset.tier, bt = +be.dataset.tier;
    return { ...e, ae, be, at, bt, dir: bt > at ? "right" : bt < at ? "left" : "vert",
             hot: ae.classList.contains("added") || be.classList.contains("added") };
  }).filter(Boolean);

  // 1) 라벨을 먼저 만든다 — 크기가 통로 폭과 카드 높이를 정한다
  lab.innerHTML = "";
  edges.forEach((e) => {
    if (!e.l) return;
    const t = document.createElement("div");
    t.className = "wl" + (e.hot ? " added" : "");
    t.textContent = e.l;
    lab.appendChild(t);
    e.lel = t;
  });

  // 2) 통로 폭 = 양끝 여백 + 왼쪽 라벨 구역 + 줄기 수 × 줄기 간격 + 오른쪽 라벨 구역.
  //    전체가 화면 폭을 넘으면 라벨 최대 폭을 줄이고(줄바꿈), 그래도 넘으면 칸을 좁힌다(compact).
  //    그래도 넘으면 그림 안에서 가로로 스크롤된다 — 검사기 L4 가 미리 알린다
  const gaps = tiers.slice(0, -1).map(() => ({ right: new Map(), left: new Map(), rw: 0, lw: 0, w: MIN_GAP }));
  edges.forEach((e) => {
    if (e.dir === "vert") return;
    e.gi = e.dir === "right" ? e.at : e.at - 1;
    const g = gaps[e.gi];
    if (g) push(e.dir === "right" ? g.right : g.left, e.s, e);
  });
  const avail = root.clientWidth;
  for (const [compact, cap] of [[false, 168], [false, 140], [false, 116], [false, 96], [true, 96], [true, 84]]) {
    canvas.classList.toggle("compact", compact);
    const tiersW = tiers.reduce((sum, t) => sum + t.offsetWidth, 0);
    edges.forEach((e) => {
      if (!e.lel) return;
      e.lel.style.maxWidth = cap + "px";
      e.lw = e.lel.offsetWidth; e.lh = e.lel.offsetHeight;
    });
    gaps.forEach((g) => {
      g.rw = Math.max(0, ...[...g.right.values()].flat().map((e) => e.lw || 0));
      g.lw = Math.max(0, ...[...g.left.values()].flat().map((e) => e.lw || 0));
      const w = 2 * END + (g.lw ? g.lw + LGAP : 0) + (g.left.size + g.right.size) * LANE + (g.rw ? g.rw + LGAP : 0);
      g.w = Math.max(MIN_GAP, Math.ceil(w));
    });
    if (tiersW + gaps.reduce((sum, g) => sum + g.w, 0) <= avail) break;
  }
  canvas.style.gap = "0px";
  tiers.forEach((t, i) => { t.style.marginRight = (gaps[i] ? gaps[i].w : 0) + "px"; });

  // 3) 카드 가장자리마다 쓰는 자리 = 들어오는 선 하나씩 + 나가는 줄기 하나(같은 쪽으로 나가는 선은 한 줄로 묶인다).
  //    들고 나는 선이 같은 높이를 쓰면 한 줄로 겹쳐 보이므로 자리를 나눠 주고, 자리가 여럿이면 라벨이 겹치지 않을 만큼 카드를 늘린다
  canvas.querySelectorAll(".card").forEach((c) => { c.style.minHeight = ""; });
  const sides = new Map();
  const side = (key, el) => sides.get(key) || sides.set(key, { el, ins: [], outs: [] }).get(key);
  edges.filter((e) => e.dir !== "vert").forEach((e) => {
    side(e.t + "|" + (e.dir === "right" ? "L" : "R"), e.be).ins.push(e);
    side(e.s + "|" + (e.dir === "right" ? "R" : "L"), e.ae).outs.push(e);
  });
  const need = new Map();
  sides.forEach((sd) => {
    const slots = sd.ins.length + (sd.outs.length ? 1 : 0);
    if (slots < 2) return;
    const step = Math.max(24, ...sd.ins.map((e) => (e.lh || 0) + LABEL_SEP));
    need.set(sd.el, Math.max(need.get(sd.el) || 0, Math.ceil(step * (slots + 1))));
  });
  need.forEach((h, el) => { if (el.offsetHeight < h) el.style.minHeight = h + "px"; });

  // 4) 늘린 뒤의 자리를 잰다
  const cr = canvas.getBoundingClientRect();
  const rel = (el) => { const r = el.getBoundingClientRect(); return { x: r.left - cr.left, y: r.top - cr.top, w: r.width, h: r.height }; };
  const bands = tiers.map(rel);
  edges.forEach((e) => { e.a = rel(e.ae); e.b = rel(e.be); });
  // 가장자리 자리 배정 — 들어오는 선은 출발 카드의 높이 순, 나가는 줄기는 대상들의 평균 높이 자리에 하나
  edges.forEach((e) => { e.sf = 0.5; e.tf = 0.5; });
  const mid = (r) => r.y + r.h / 2;
  sides.forEach((sd) => {
    const items = sd.ins.map((e) => ({ key: mid(e.a), set: (f) => { e.tf = f; } }));
    if (sd.outs.length) {
      items.push({ key: sd.outs.reduce((sum, e) => sum + mid(e.b), 0) / sd.outs.length,
                   set: (f) => sd.outs.forEach((e) => { e.sf = f; }) });
    }
    items.sort((p, q) => p.key - q.key);
    items.forEach((it, i) => it.set((i + 1) / (items.length + 1)));
  });
  edges.forEach((e) => { e.sy = e.a.y + e.a.h * e.sf; e.ey = e.b.y + e.b.h * e.tf; });

  // 5) 줄기 순서 — 엇갈림이 가장 적은 순서(줄기 6개까지는 전부 따져 본다). 0번이 출발 카드에 가장 가깝다
  const perms = (arr) => (arr.length <= 1 ? [arr]
    : arr.flatMap((x, i) => perms([...arr.slice(0, i), ...arr.slice(i + 1)]).map((p) => [x, ...p])));
  const order = (groups) => {
    const info = groups.map((list) => {
      const ys = [list[0].sy, ...list.map((e) => e.ey)];
      return { list, sy: list[0].sy, eys: list.map((e) => e.ey), lo: Math.min(...ys), hi: Math.max(...ys) };
    }).sort((p, q) => p.sy - q.sy);
    if (info.length < 2 || info.length > 6) return info;
    const inside = (y, t) => y > t.lo + 0.5 && y < t.hi - 0.5;
    // p 가 출발 쪽, q 가 그 너머 — q 의 나가는 선이 p 를 가로지르고, p 의 가지가 q 를 가로지른다
    const cost = (p, q) => (inside(q.sy, p) ? 1 : 0) + p.eys.filter((y) => inside(y, q)).length;
    let best = info, bc = Infinity;
    perms(info).forEach((pm) => {
      let c = 0;
      for (let i = 0; i < pm.length; i++) for (let j = i + 1; j < pm.length; j++) c += cost(pm[i], pm[j]);
      if (c < bc) { bc = c; best = pm; }
    });
    return best;
  };
  gaps.forEach((g, i) => {
    const x0 = bands[i].x + bands[i].w, x1 = bands[i + 1].x;
    g.x0 = x0; g.x1 = x1;
    const lt = order([...g.left.values()]), rt = order([...g.right.values()]);
    const start = x0 + END + (g.lw ? g.lw + LGAP : 0);
    // 왼쪽으로 가는 줄기는 출발 카드(오른쪽)에 가까운 것부터 오른쪽에, 오른쪽으로 가는 줄기는 왼쪽부터
    lt.forEach((t, k) => { const x = start + (lt.length - 1 - k) * LANE + LANE / 2; t.list.forEach((e) => { e.mx = x; }); });
    rt.forEach((t, k) => { const x = start + (lt.length + k) * LANE + LANE / 2; t.list.forEach((e) => { e.mx = x; }); });
    const end = start + (lt.length + rt.length) * LANE;
    g.rz = (end + LGAP + x1 - END) / 2;       // 오른쪽 라벨 구역 가운데
    g.lz = (x0 + END + start - LGAP) / 2;     // 왼쪽 라벨 구역 가운데
  });

  // 5-2) 같은 높이로 겹치는 수평 구간을 비킨다 — 서로 다른 카드의 선이 같은 높이로 한 통로를 지나면 한 줄로 이어져
  //      "A 가 B 를 직접 부른다"처럼 읽힌다. 왼쪽으로 가는 선의 나가는 구간을 먼저, 그다음 나가는 구간, 마지막에 가지를 옮긴다
  const hsegs = () => {
    const out = [];
    edges.forEach((e) => {
      const g = gaps[e.gi];
      if (e.dir === "vert" || !g) return;
      const right = e.dir === "right";
      out.push({ e, exit: true, y: e.sy, x0: right ? g.x0 : e.mx, x1: right ? e.mx : g.x1 });
      out.push({ e, exit: false, y: e.ey, x0: right ? e.mx : g.x0, x1: right ? g.x1 : e.mx });
    });
    return out;
  };
  const clash = (p, q) => p.e.s !== q.e.s && Math.abs(p.y - q.y) < 6 && Math.min(p.x1, q.x1) - Math.max(p.x0, q.x0) > 2;
  const rank = (sg) => (sg.exit ? (sg.e.dir === "left" ? 0 : 1) : 2);
  for (let guard = 0; guard < 24; guard++) {
    const all = hsegs();
    let hit = null;
    for (let i = 0; i < all.length && !hit; i++) for (let j = i + 1; j < all.length && !hit; j++) {
      if (clash(all[i], all[j])) hit = rank(all[i]) <= rank(all[j]) ? all[i] : all[j];
    }
    if (!hit) break;
    const r = hit.exit ? hit.e.a : hit.e.b;
    const group = hit.exit ? edges.filter((x) => x.s === hit.e.s && x.dir === hit.e.dir) : [hit.e];
    const moved = [14, -14, 26, -26].some((d) => {
      const y = hit.y + d;
      if (y < r.y + 10 || y > r.y + r.h - 10) return false;
      const trial = { ...hit, y };
      if (all.some((q) => q !== hit && q.e !== hit.e && clash(trial, q))) return false;
      group.forEach((x) => { if (hit.exit) x.sy = y; else x.ey = y; });
      return true;
    });
    if (!moved) break;
  }

  // 6) 그린다 — 출발 카드별로 [바탕색 테 → 선]. 뒤에 그린 묶음의 테가 앞 묶음의 선을 엇갈리는 자리에서 끊는다.
  //    테는 칸 사이 통로에만 깐다(칸 바탕 위에 흰 테가 비치지 않게)
  // id 는 구조도마다 달라야 한다 — 같으면 다른 탭(숨은 svg)의 정의를 가리켜 화살촉이 사라진다
  const uid = "arch" + [...document.querySelectorAll(".arch")].indexOf(root);
  const cid = uid + "-corridor";
  svg.innerHTML = "<defs>" + [["m", muted], ["b", brand]].map(([id, c]) =>
    '<marker id="' + uid + '-ah-' + id + '" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">' +
    '<path d="M0 0L10 5L0 10z" fill="' + c + '"/></marker>').join("") +
    '<clipPath id="' + cid + '">' + gaps.map((g) =>
      '<rect x="' + g.x0 + '" y="0" width="' + Math.max(0, g.x1 - g.x0) + '" height="' + cr.height + '"/>').join("") +
    "</clipPath></defs>";
  edges.forEach((e) => {
    const { a, b } = e;
    if (e.dir === "vert") {
      const down = b.y > a.y;
      const x = a.x + a.w / 2;
      const sy = down ? a.y + a.h : a.y, ey = down ? b.y : b.y + b.h;
      e.d = "M" + x + " " + sy + " V" + ey;
      e.lx = x; e.ly = (sy + ey) / 2;
    } else {
      const right = e.dir === "right";
      const sx = right ? a.x + a.w : a.x, ex = right ? b.x : b.x + b.w;
      e.d = "M" + sx + " " + e.sy + " H" + e.mx + " V" + e.ey + " H" + ex;
      const g = gaps[e.gi];
      e.lx = g ? (right ? g.rz : g.lz) : e.mx; e.ly = e.ey;
    }
  });
  const line = (e, halo) => {
    const p = document.createElementNS(NS, "path");
    const w = e.k === "data" ? 3.5 : 1.6;
    p.setAttribute("d", e.d);
    p.setAttribute("fill", "none");
    p.setAttribute("stroke-linejoin", "miter");
    if (halo) {
      p.setAttribute("stroke", ground);
      p.setAttribute("stroke-width", w + 6);
      p.setAttribute("clip-path", "url(#" + cid + ")");
    } else {
      p.setAttribute("stroke", e.hot ? brand : muted);
      p.setAttribute("stroke-width", w);
      if (e.k === "event") p.setAttribute("stroke-dasharray", "6 4");
      p.setAttribute("marker-end", "url(#" + uid + "-ah-" + (e.hot ? "b" : "m") + ")");
    }
    svg.appendChild(p);
  };
  const bySrc = new Map();
  edges.forEach((e) => push(bySrc, e.s, e));
  bySrc.forEach((list) => {
    list.sort((p, q) => Number(p.hot) - Number(q.hot));   // 함께 쓰는 줄기는 새 부분(파란 선) 색이 위로
    list.forEach((e) => line(e, true));
    list.forEach((e) => line(e, false));
  });
  edges.forEach((e) => {
    if (!e.lel) return;
    e.lel.style.left = e.lx + "px";
    e.lel.style.top = e.ly + "px";
  });
}
document.querySelectorAll(".arch").forEach((root) => {
  const redraw = () => drawArch(root);
  if (window.ResizeObserver) new ResizeObserver(redraw).observe(root.querySelector(".arch-canvas"));
  window.addEventListener("load", redraw);
  if (document.fonts) document.fonts.ready.then(redraw);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
});

select(current);
try {
  const { default: mermaid } = await import(MERMAID_URL);
  await render(mermaid);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render(mermaid));
} catch (e) {
  document.querySelectorAll(".dia-note").forEach((n) => { n.hidden = false; });
  select(current);
}
</script>
</body>
</html>
